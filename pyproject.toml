[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aynime-issen-style"
version = "0.1.0"
description = "Windows CustomTkinter tool for capturing still and animated frames from DXGI windows."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "NU-Pan" }]
keywords = ["customtkinter", "screen-capture", "windows"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License"
]
dependencies = [
  # NOTE
  #   customtkinter は 5.2.2 に固定する。
  #   本体は 5.2.2 系を前提に書かれている。
  #   次のリリースが 2 年半ぶりのメジャー更新（6.0.0）なので、追従は別途検証してから。
  "customtkinter==5.2.2",
  "CTkListbox",
  "aynime_capture @ git+https://github.com/Nu-Pan/aynime_capture ; sys_platform == 'win32'",
  "aynime_capture @ git+https://github.com/chikuwav/aynime_capture_mac ; sys_platform == 'darwin'",
  "numpy",
  "packaging",
  "pillow",
  "scikit-image",
  "tkinterdnd2",
  "pywin32 ; sys_platform == 'win32'",
  "quickmachotkey ; sys_platform == 'darwin'",
  "black",
  "pyinstaller"
]

[project.urls]
Homepage = "https://github.com/Nu-Pan/aynime_issen_style"
Repository = "https://github.com/Nu-Pan/aynime_issen_style"
Issues = "https://github.com/Nu-Pan/aynime_issen_style/issues"
Documentation = "https://github.com/Nu-Pan/aynime_issen_style/wiki"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
